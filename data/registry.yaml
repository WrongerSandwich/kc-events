    neighborhood: Crossroads
    checkHints: Club at 1520 Grand Blvd. Dates appear as day-month on the shows list.
    status: active

  - name: The Midland
    urls: [https://www.midlandkc.com/events]
    kind: music
    neighborhood: Downtown
    checkHints: Arvest Bank Theatre at the Midland, 1228 Main St. The list links each show to an AXS ticket page.
    status: active
    notes: RSS feed at https://www.midlandkc.com/events/rss

  - name: T-Mobile Center
    urls: [https://www.t-mobilecenter.com/events]
    kind: music
    neighborhood: Downtown
    checkHints: Arena at 1407 Grand Blvd; concerts, touring family shows and sports.
