  - name: The Truman
    urls: [https://www.thetruman.com/]
    kind: music
    neighborhood: Midtown
    checkHints: Club at 608 E 31st St; the homepage carries the full show list.
    status: active
    notes: Extracted cleanly in the 2026-10-02 demo; on 2026-10-03 its TLS handshake failed for every client, so watch the failing-sources report.

  - name: Azura Amphitheater
    urls: [https://www.azuraamp.com/kansas-city-concert-and-events-calendar.html]
    kind: music
    neighborhood: Bonner Springs
    checkHints: Outdoor amphitheater, season roughly May to October.
