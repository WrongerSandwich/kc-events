    kind: music
    neighborhood: Downtown
    checkHints: The homepage carries the season. Presenter; performances are at the Folly Theater, the Kauffman Center and elsewhere, so read the venue from each listing.
    status: excluded
    reason: Its homepage names no venue for any performance, so every event is held unverified; its performances are found on the Folly Theater and Lied Center calendars, which name the hall (checked 2026-10-04).
    notes: Presenter based at William Jewell College in Liberty; most shows are downtown.

