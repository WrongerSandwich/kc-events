  # --- Festivals, markets, community -------------------------------------------------------------

  - name: Power & Light District
    urls: [https://www.powerandlightdistrict.com/events-and-entertainment/events]
    kind: other
    neighborhood: Downtown
    checkHints: Entertainment district; KC Live! block concerts and festivals. Watch parties and its bars' and restaurants' standing nights are promotions, not events, even when a listing is dated, such as Jokes by the Slice at Pizza Bar (open-mic sets with a happy hour) and Palm Tree KC's dining-and-DJ nights (me n ü). A party sold on its own tickets at KC Live!, such as End of Days on Halloween, is an event.
    status: active

  - name: Crown Center
    urls: [https://www.crowncenter.com/events]
    kind: other
    neighborhood: Crown Center
    checkHints: The district's calendar, 2450 Grand Blvd; exhibits in the shops, events on the square, and shows by its theaters. Read the kind from each listing; a Musical Theater Heritage run listed here is theater/dance. Skip The Coterie's productions, which this page lists at the shops whatever their venue and dates, without naming The Coterie; The Coterie source carries them. In the 2026–27 season they are Electric Poe, The Pigeon Gets a Big Time Holiday Extravaganza!, JACKED! A Beanstalk Remix, The Gingerbread Kid, Madagascar – A Musical Adventure, Baby Rave, Kidtropolis and Electric Renaissance. A month of offers from the district's businesses, such as the Homeschool Event (activity packets and discounts), is not an event.
    status: active
    notes: Discovery read eleven events from this page before it was a source (2026-10-10).

  - name: Kansas City Convention Center
    urls: [https://kcconvention.com/events/]
    kind: other
    neighborhood: Downtown
    checkHints: Public shows and conventions; most of the calendar is business the public cannot attend, such as Jack Henry Connect (a client conference), EDspaces, the PACEshow, the KOA Convention & Expo and the Grassroots Connect Show (trade shows), and the United Soccer Coaches Convention. Keep what sells to the public, such as consumer shows (boat, home and flower, bridal, hunting, pet), fan and game conventions, fairs, auctions, and sports. A booking that has published no time is given the calendar's day block, 8:00 am to 5:00 pm (UMKC Basketball vs Montana State, "Info TBD"); a listing that starts at 8:00 am and ends at 5:00 pm, on one day or across several, has no time, so give its dates alone, unless its text gives those hours in words. Skip the touring Broadway shows at the Music Hall; the American Theatre Guild source carries each with its full run.
    status: active
    notes: ICS feed at https://kcconvention.com/events/?ical=1

  - name: City Market
    urls: [https://thecitymarketkc.org/events/]
    kind: festivals/markets
    neighborhood: River Market
    checkHints: The farmers market is recurring (weekends); seasonal markets and festivals are limited runs or one-offs.
    status: active
    notes: Was thecitymarket.org, which now redirects to thecitymarketkc.org (checked 2026-10-10).

  - name: American Royal
    urls: [https://americanroyal.com/calendar/]
    kind: festivals/markets
    neighborhood: Elsewhere in the metro
    checkHints: BBQ, rodeo and livestock events; venues vary, so read the venue from each listing.
    status: active
    notes: ICS feed at https://americanroyal.com/calendar/list/?ical=1

  - name: KC Parks and Recreation
    urls: [https://kcparks.org/events/]
    kind: outdoors/community
    neighborhood: Elsewhere in the metro
    checkHints: Events across the city's parks; classes and leagues are not events.
    status: active
    notes: ICS feed at https://kcparks.org/events/?ical=1

  - name: Kansas City Zoo & Aquarium
    urls: [https://kansascityzoo.org/events]
    kind: outdoors/community
    neighborhood: Swope Park
    checkHints: Zoo at 6800 Zoo Dr in Swope Park. Scout programs (Cub Scout Night at the Zoo) are for scout groups only, not the public.
    status: active

  - name: Powell Gardens
    urls: [https://powellgardens.org/]
    kind: outdoors/community
    neighborhood: Elsewhere in the metro
    checkHints: The homepage carries the event list; /events is a 404. Botanical garden near Kingsville. Dark Forest runs on separate weekends (the banner quotes them all), so it is one event at its next span. Fire Feast is Dark Forest's add-on dinner, sold only with a Dark Forest ticket, so it is part of Dark Forest, not a separate event.
    status: active

  - name: Kansas City Renaissance Festival
    urls: [https://www.kcrenfest.com/]
    kind: festivals/markets
    neighborhood: Bonner Springs
    checkHints: One seasonal run, Saturdays and Sundays from early September to mid-October plus a couple of Mondays, at the festival grounds in Bonner Springs; the homepage banner gives the season's dates. Theme weekends are part of that run, not separate events. Some theme-weekend pages still carry last year's dates.
    status: active
    notes: Refuses any user agent containing "research" (HTTP 403); fetchable since the job's user agent became kc-this-week (ADR 0011, 2026-10-08).

  # --- Excluded: known, deliberately not fetched -------------------------------------------------

  - name: Musical Theater Heritage
    urls: [https://www.mtheritage.com/]
    kind: theater/dance
    neighborhood: Crown Center
    status: excluded
    reason: robots.txt disallows the site (checked 2026-10-03).

  - name: Starlight Theatre
    urls: [https://www.kcstarlight.com/events/]
    kind: theater/dance
    neighborhood: Swope Park
    status: excluded
    reason: The events and tickets pages redirect to a queue-it waiting room whose robots.txt disallows fetching (checked 2026-10-03).
    notes: The homepage loads but carries no listings.

  - name: Uptown Theater
    urls: [https://uptowntheater.com/calendar/]
    kind: music
    neighborhood: Midtown
    status: excluded
    reason: Even rendered in a browser the site lists no shows; its calendar page only links out to Ticketmaster, and /events/ shows a broken-plugin error (checked 2026-10-08).
    notes: Its RSS feed gives post dates, not show dates.

  - name: Kansas City Royals
    urls: [https://www.mlb.com/royals/schedule]
    kind: sports
    neighborhood: Truman Sports Complex
    status: excluded
    reason: Off-season. Rendered in a browser, the schedule shows games, but there are none until spring training (checked 2026-10-08 on the September page). Activate it in late February with a browser fetch; each home game is its own one-off (#159).
    notes: The page redirects to the current month's grid, so in season a run reads only the rest of that month. Wait for games with a selector; the page never goes network-quiet, so without one the browser fetch times out.

  - name: Funny Bone Comedy Club
    urls: [https://kc.funnybone.com/]
    kind: comedy
    neighborhood: Overland Park
    status: excluded
    reason: Cloudflare blocks every non-interactive client with HTTP 403, a headless browser and a browser's user agent included (checked 2026-10-08). Only the club allowing the job's user agent would change that; its acts often play Comedy Club KC and recordBar, which are sources.

  - name: Kansas City Museum
    urls: [https://museumofkansascity.org/events/]
    kind: art/exhibitions
    neighborhood: Northeast
    checkHints: Museum in Corinthian Hall, 3218 Gladstone Blvd. Exhibitions are limited runs; a film series, Día de los Muertos and other one-offs are listed too. soft clubbing at Elixir, a DJ night in the museum's soda fountain café, is a standing night and a promotion, so skip it.
    status: active
    notes: kansascitymuseum.org sits behind a Cloudflare challenge (HTTP 403 to every non-interactive client; checked 2026-10-08), but museumofkansascity.org is the museum's own site and fetches plainly; discovery read six events from it before it was a source (2026-10-10).

  - name: Union Station
    urls: [https://unionstation.org/events/]
    kind: other
    neighborhood: Crown Center
    status: excluded
    reason: Even rendered in a browser, the list shows only one day's events with no dates on them (exhibitions, shows, the planetarium), and nothing beyond that day (checked 2026-10-08). City Stage productions come in through their presenters.
    notes: Its RSS feed carries no event dates.
