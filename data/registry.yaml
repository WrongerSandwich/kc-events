  - name: Folly Theater
    urls: [https://follytheater.org/events/]
    kind: music
    neighborhood: Downtown
    checkHints: Historic theater at 300 W 12th St; hosts the Harriman-Jewell Series, Friends of Chamber Music and jazz series.
