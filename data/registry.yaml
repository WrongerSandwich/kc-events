# The registry: sources checked on every run. Hand-edited only.
#
# Each source:
#   name: Knuckleheads
#   urls: [https://example.com/calendar]   # the calendar page, not a feed (see below)
#   kind: music                            # from the kinds taxonomy in research.config.yaml
#   neighborhood: East Bottoms             # listed under a region in research.config.yaml, or the catch-all
#   checkHints: free text passed to the extractor
#   status: active                         # or excluded, with a reason
#   reason: robots.txt disallows           # required when excluded
#   notes: free text
#
# Point every URL at the page that carries the listings, never a homepage that only links to them;
# where a homepage is the listings page, the check hints say so. The neighborhood is where the
# source's own venue is; a source that books many venues names its home base, and its check hints
# tell the extractor to read the venue from each listing.
#
# Growing the registry: the first runs' don't-miss picks leaned heavily to music, because concert
# rooms and series list many dated one-offs while museums, parks and festivals mostly yield runs and
# recurring things. Weight new sources toward non-music ones that list dated one-offs: comedy rooms,
# film societies, lecture series, food and drink organizers, sports beyond the big teams.
#
# Feeds are not used yet, though the brief prefers them: an event read from an ICS or RSS feed cites
# its own page, which the run never fetches, so under cite-or-drop every one stays unverified. A
# source's feed is kept in its notes for when that changes.

sources:
  # --- Music -------------------------------------------------------------------------------------

  - name: Kauffman Center for the Performing Arts
    urls: [https://www.kauffmancenter.org/events/]
    kind: music
    neighborhood: Crossroads
    checkHints: Lists every performance in Helzberg Hall and Muriel Kauffman Theatre, including the Symphony, Lyric Opera, KC Ballet and touring Broadway; the Symphony and KC Ballet are also their own sources.
    status: active

  - name: Kansas City Symphony
    urls: [https://www.kcsymphony.org/upcoming-events/]
    kind: music
    neighborhood: Crossroads
    checkHints: Most concerts are in Helzberg Hall at the Kauffman Center; date ranges like "OCT 23-25" are one run of the same program.
    status: active

  - name: recordBar
    urls: [https://www.therecordbar.com/shows]
