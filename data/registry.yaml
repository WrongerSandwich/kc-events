    notes: The calendar shows 21 events and pages the rest by script (#226); no plain URL pages it (?page=2 and ?paged=2 redirect back, /page/2/, ?pg=2, ?view=list and ?view=tile give the same first 21, ?view=month loads by script), and its plain page is a stale cache (on 2026-10-24 it still listed Oct 14-18), so it is never fetched. The urls are the feed its script pages, live, in date order, 21 a page; JSON carrying the listings' HTML, read as that HTML, and one listing at the calendar's URL, so an event moving between pages stays on one page. On 2026-10-24 they held 21, 21 and 14 of 56 events, page 3 all past the horizon, page 4 empty. Add page 4 once page 3's last listing falls inside the horizon, and drop the last page if the report says it reads as listing nothing, since an empty page holds every event of the listing.
    status: active

