<!doctype html>
<!-- The 1200x630 share image. Rendered to public/og.png by share-image.ts, by hand, when the design changes. Light-scheme tokens copied inline. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KC Events share image</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        font-weight: 100 900;
        src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2-variations");
      }
      :root { --bg: #faf8f4; --fg: #1a1916; --fg-muted: #5f5b53; --text-2xl: 1.75rem; --text-xl: 1.375rem; }
      html, body { margin: 0; width: 1200px; height: 630px; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter Variable", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }
      h1 { margin: 0; font-size: calc(var(--text-2xl) * 3); font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; }
      p { margin: 32px 0 0; max-width: 22em; font-size: calc(var(--text-xl) * 1.6); line-height: 1.35; color: var(--fg-muted); }
    </style>
  </head>
  <body>
    <h1>KC Events</h1>
    <p>A weekly researched, ad-free list of what's worth doing in Kansas City.</p>
  </body>
</html>
