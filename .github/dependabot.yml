# Weekly bumps, one grouped pull request per ecosystem. A version is proposed only once it is seven
# days old (cooldown), the same wait pnpm-workspace.yaml's minimumReleaseAge puts on an install.
version: 2
updates:
  - package-ecosystem: npm
    # The workspace root only: its one lockfile covers both packages (the job and site/).
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    # The site's typecheck is astro check, which refuses TypeScript 7 (the job's root package is already on it).
    # @types/node follows the Node major in .nvmrc (test/node-version.test.ts), so it moves by hand with Node.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
