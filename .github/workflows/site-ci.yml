# Guards the site on pull requests and pushes to main. The weekly research commit is pushed with the
# default GITHUB_TOKEN, which does not trigger workflows, so on that commit the build assertions run
# only inside Vercel's build; that build is the one that would publish bad data, so it is enough.
#
# Order matters: the real build and its size check run before the tests, because the built-output
# tests read dist/ and fail in CI when it is missing. The end-to-end build (dist-e2e/) also runs before
# the size check, which measures the explorer and the front page on its fixed fixture data so those
# budgets track code, not the week's events and picks; Playwright rebuilds it for the end-to-end tests.
# The size check runs here and not in `pnpm build`, which is Vercel's build command: a page going over
# budget should fail CI, not stop the weekly data commit from deploying.
name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still going.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (version in the comment); Dependabot proposes the bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Built as of the last run's day, as the tests generate it, so the built-output tests read the same events on any day.
      - run: pnpm --filter kc-events-site build
        env:
          SITE_TODAY: last-run
      - run: pnpm --filter kc-events-site build:e2e
      - run: pnpm --filter kc-events-site size
      # The tests, with coverage: reported for reading, with no threshold to fail on.
      - run: pnpm -r test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            coverage
            site/coverage
          if-no-files-found: ignore
      - run: pnpm --filter kc-events-site exec playwright install --with-deps chromium
      - run: pnpm --filter kc-events-site test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
