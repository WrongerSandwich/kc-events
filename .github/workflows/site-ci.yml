# Guards the site on pull requests and pushes to main. The weekly research commit is pushed with the
# default GITHUB_TOKEN, which does not trigger workflows, so on that commit the build assertions run
# only inside Vercel's build; that build is the one that would publish bad data, so it is enough.
#
# Order matters: the real build and its size check run before the tests, because the built-output
# tests read dist/ and fail in CI when it is missing. The end-to-end build (dist-e2e/) also runs before
# the size check, which measures the explorer on its fixed fixture data so that budget tracks code, not
# the week's event count; Playwright rebuilds it for the end-to-end tests.
# The size check runs here and not in `pnpm build`, which is Vercel's build command: a page going over
# budget should fail CI, not stop the weekly data commit from deploying.
name: Site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter kc-events-site build
      - run: pnpm --filter kc-events-site build:e2e
      - run: pnpm --filter kc-events-site size
      - run: pnpm -r test
      - run: pnpm --filter kc-events-site exec playwright install --with-deps chromium
      - run: pnpm --filter kc-events-site test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
