name: Wrong listing
description: A date, venue, or anything else on kcthisweek.com is wrong.
title: "Wrong listing: "
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What the listing says, and what is right if you know it (a link that shows it helps).
    validations:
      required: true
  - type: input
    id: event
    attributes:
      label: Event on kcthisweek.com
      description: The event's page on this site, if the report is about one event.
  - type: input
    id: primary-page
    attributes:
      label: Page it was read from
      description: The venue's or organizer's page the date and venue were read from.
  - type: input
    id: event-page
    attributes:
      label: Event's own page
      description: Where the listing's Details and tickets link goes, when it is not the page above.
