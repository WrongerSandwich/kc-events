# Run config for the research job. Committed; secrets never go here.
# Secrets come from the environment (or a gitignored .env for hand runs):
#   OPENROUTER_API_KEY, TAVILY_API_KEY

horizonWeeks: 8 # the milestone-one hand run uses: pnpm research --horizon-weeks 3
timezone: America/Chicago
geography: Kansas City metro on both sides of the state line, plus Lawrence
# Per-run spend cap in USD, summed from the cost OpenRouter reports on every model call. Once it is
# reached no further model calls are made; pages left unread and events left unchecked stay as
# they were, and the run report records the shortfall. This is the first of two layers: the
# second is a monthly limit set by hand on the OpenRouter key itself (the milestone hand-run
# wizard, #11, walks setting it), so a bug in this cap cannot cost more than that ceiling.
spendCapUsd: 5

models:
  extraction: openai/gpt-6-luna
  curation: anthropic/claude-sonnet-5.5

kinds:
  - music
  - theater/dance
  - comedy
  - art/exhibitions
  - festivals/markets
  - food/drink
  - sports
  - film
  - talks/readings
  - outdoors/community
  - other

# Controlled list. Every registry source's neighborhood is added to it at run time, so list here
# only the ones no source names yet. The two catch-alls are required. An address that maps to
# nothing lands in "Elsewhere in the metro" and is flagged in the run report.
neighborhoods:
  - Lawrence
  - Elsewhere in the metro

# The discovery lane: web searches (Tavily, basic depth, one credit each; needs TAVILY_API_KEY) for
# events outside the registry. One query per kind but "other", naming the place and the horizon's
# months. Every result is a lead: a primary page is fetched and extracted under the same rules as a
# registry page, with the query recorded as the event's lead. An aggregator page is read only as an
# index: its outbound links are followed, its own text never reaches extraction. A host discovery
# finds events on in two runs is suggested for promotion in the run report, never added here.
# `pnpm research --discovery` turns it on for one run.
discovery:
  enabled: false
  place: Kansas City # the geography in the few words a search engine wants
  resultsPerQuery: 5
  linksPerAggregatorPage: 10
  aggregatorHosts: # third-party listing sites; a host covers its subdomains
    - do816.com
    - visitkc.com
    - thepitchkc.com
    - kansascity.com
    - kcparent.com
    - allevents.in
    - songkick.com
    - bandsintown.com
    - patch.com
    - feverup.com
  ignoredHosts: # never followed: social media and the like, which carry no primary page
    - facebook.com
    - instagram.com
    - x.com
    - twitter.com
    - tiktok.com
    - youtube.com
    - linkedin.com
    - pinterest.com
    - reddit.com
    - google.com
    - apple.com
