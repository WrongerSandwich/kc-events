# Run config for the research job. Committed; secrets never go here.
# Secrets come from the environment (or a gitignored .env for hand runs):
#   OPENROUTER_API_KEY, TAVILY_API_KEY

# How far ahead each run looks. Milestone one (#11) was graded at 3 weeks, and `pnpm grade` only
# accepts a 3-week report; the weekly workflow runs at the spec's 8-week default.
horizonWeeks: 8
timezone: America/Chicago
geography: Kansas City metro on both sides of the state line, plus Lawrence
# Per-run spend cap in USD, summed from the cost OpenRouter reports on every model call. Once it is
# reached no further model calls are made; pages left unread and events left unchecked stay as
# they were, and the run report records the shortfall. This is the first of two layers: the
# second is a monthly limit set by hand on the OpenRouter key itself (the milestone hand-run
# wizard, #11, walks setting it), so a bug in this cap cannot cost more than that ceiling.
spendCapUsd: 5
# How many times each registry page is read with the extraction model: 2 or 1. At 2 both reads of a
# page start together, the first's sightings merge ahead of the second's, so the second confirms
# what the first verified or covers what it missed (#223 measured 94.4% to 96.3% of stored records
# verified, about $0.10 and 2 minutes more a week). A page is not extracted only when both reads
# fail; its counts come from the first read that worked, and the source's report line says how many
# sightings the second read added. Discovery leads, re-verification and own pages are read once.
extractionReads: 2
# How many pages each stage reads at once (#252): registry pages (a page's two reads together, so up
# to twice this many model calls in flight), discovery leads, re-verified pages and own pages. The
# calls go out in page order and each is checked against spendCapUsd before it goes, so a run can end
# up to about 2 x concurrency calls past the cap (a few cents against a 5 USD cap). The fetch policy's
# pause is per origin, so pages on one host are still fetched a crawl delay apart. 1 reads one page at
# a time.
concurrency: 4

# The most own pages a run reads before curation (#254): every upcoming event's own page is read once,
# nearest start first, for its time, price, age limit, days and description; what this leaves is read at
# the next run, and the report says how many were left.
ownPageReadsPerRun: 150

models:
  extraction: openai/gpt-6-luna
  curation: anthropic/claude-sonnet-5.5

kinds:
  - music
  - theater/dance
  - comedy
  - art/exhibitions
  - festivals/markets
  - food/drink
  - sports
  - film
  - talks/readings
  - outdoors/community
  - other

# Neighborhoods, grouped by region. A neighborhood is the most specific place name people use: a
# district in the core, a city in the suburbs. A region groups them at the scale of a trip decision,
# for the site to browse by. The extractor picks an event's neighborhood from every region's list
# plus "Elsewhere in the metro", the catch-all in no region: an address that maps to nothing lands
# there and is flagged in the run report. An event stored under a neighborhood no longer listed here
# is placed again in any run in which no page re-reads it (a region's name goes to its registry
# source's neighborhood when that region lists it, anything else to the catch-all), and the run
# report names each such value. Every registry source's neighborhood must be listed here
# (or be the catch-all), a neighborhood goes under one region only, and some region must list
# "Lawrence" (the extraction rules use it for anywhere in Lawrence); the config fails otherwise.
neighborhoods:
  Central KC:
    - Downtown
    - Crossroads
    - River Market
    - Crown Center
    - 18th & Vine
    - Westport
    - Midtown
    - Plaza & Museum District
    - West Bottoms
    - East Bottoms
    - Berkley Riverfront
    - Northeast
    - Waldo
    - Brookside
  South KC:
    - South Kansas City
    - Swope Park
    - Truman Sports Complex
  Northland: # the cities first; "Northland" itself for an address in none of them
    - Northland
    - North Kansas City
    - Gladstone
    - Parkville
    - Riverside
    - Liberty
    - Kearney
    - Excelsior Springs
    - Platte City
  Kansas City, Kansas:
    - Kansas City, Kansas
    - Bonner Springs
  Johnson County:
    - Overland Park
    - Olathe
    - Lenexa
    - Prairie Village
    - Merriam
    - Leawood
    - Shawnee
    - Fairway
    - Gardner
  Eastern Jackson County:
    - Independence
    - Lee's Summit
    - Blue Springs
    - Raytown
    - Kingsville # Powell Gardens
  Lawrence:
    - Lawrence

# The discovery lane: web searches (Tavily, basic depth, one credit each; needs TAVILY_API_KEY) for
# events outside the registry. One query per kind but "other", naming the place and the horizon's
# months. Every result is a lead: a primary page is fetched and extracted under the same rules as a
# registry page, with the query recorded as the event's lead. An index page (any aggregator page, or a
# platform listing under `platformIndexPaths`) is read only for its links: they are followed, its own
# text never reaches extraction, and an event citing one as its primary page is expired as index-page.
# A host discovery finds events on in two runs is suggested for promotion in the run report, never
# added here.
# `pnpm research --no-discovery` turns it off for one run.
discovery:
  enabled: true
  place: Kansas City # the geography in the few words a search engine wants
  resultsPerQuery: 5
  linksPerAggregatorPage: 10
  aggregatorHosts: # third-party listing sites; a host covers its subdomains
    - do816.com
    - visitkc.com
    - thepitchkc.com
    - kansascity.com
    - kcparent.com
    - allevents.in
    - songkick.com
    - bandsintown.com
    - patch.com
    - feverup.com
    - kansascitymag.com # the 2026-10-03 discovery demo read these as primary pages; they list or resell
    - kcur.org
    - teentix.org
    - kansas-city-theater.com
    - promotix.com
    - comedy.tickets
    - catchmovement.com
    - societykc.com
    - americanarenas.com # the 2026-10-03 hand run published events read from these; they list and resell
    - seatgeek.com
    - upcomingevents.com
    - artskcgo.com
    - concertfix.com
    - concerts50.com # #16: the 2026-10-03 hand run read three Midland shows from its listing page
    - kidsoutandabout.com # #53: a family-events listing site, read as a primary page by discovery through 2026-10-06
    - fairsandfestivals.net # #95: listing sites the 2026-10-09 dataset carried as primary pages; they list, never host
    - gonorthkc.com # a tourism board's calendar
    - applebaumkc.com # a realtor's "festivals around Kansas City" blog posts
    - kclivearts.org
    - festivalguidesandreviews.com
    - wanderistan.com
    - kcstudio.org # an arts magazine's calendar
    - inkansascity.com # a magazine's calendar; the 2026-10-10 hand run read Nerman exhibitions from it
  ignoredHosts: # never followed: social media and the like, which carry no primary page
    - facebook.com
    - instagram.com
    - x.com
    - twitter.com
    - tiktok.com
    - youtube.com
    - linkedin.com
    - pinterest.com
    - reddit.com
    - google.com
    - apple.com
    - bsky.app
    - doubleclick.net # ad, image, and share links followed off aggregator pages in the demo
    - sk-static.com
  platformHosts: # ticketing platforms: followed as primary pages, never suggested for promotion
    - eventbrite.com
    - ticketmaster.com
    - livenation.com
    - axs.com
    - dice.fm
    - etix.com
    - seetickets.us
    - tixr.com
    - universe.com
    - simpletix.com
    - ovationtix.com # The Coterie's box office (#143)
  platformIndexPaths: # a platform's listing pages (search, browse, category) are index pages; its event pages are not
    ticketmaster.com: [/discover/, /search] # a prefix matches at a path segment boundary
    eventbrite.com: [/d/, /b/]
  platformWaitFor: # a platform whose pages render by script: a page of performances on it is fetched through the browser, waiting for this selector (#143)
    ovationtix.com: .ot_eventDateTitle

# Venue aliases (ADR 0007): a venue's display name, then the other names pages give it, a room inside
# it or a program that runs there. Event identity treats them all as one venue, so the same show read
# as "Helzberg Hall" on one page and "Kauffman Center for the Performing Arts" on another is one event.
# Names are compared with case and punctuation ignored. A venue name goes by an entry when it is the
# entry, the entry's words in another order, or the entry with a label added ("Bartle Exhibit Hall
# (A – E)" is "Bartle Exhibit Hall"); a short form in use ("Kauffman Center") is an entry of its own,
# since a name shorter than an entry never matches it. An entry made only of generic words ("Pavilion",
# "Main Auditorium") is that name alone: "Swope Park Pavilion" is not the Lied Center's. The list is not
# per source, so a generic entry is any page's: "Galleries" anywhere is the Nelson-Atkins. List rooms of
# one building only: the Public Library's branches are separate buildings, and under one name the same
# storytime at Central and at Plaza would fold into one event. The site shows each event at its display
# name, with the page's name after it when that was a room ("Kauffman Center for the Performing Arts ·
# Helzberg Hall"). Hand-kept.
venueAliases:
  Kauffman Center for the Performing Arts: [Kauffman Center, Muriel Kauffman Theatre, Helzberg Hall]
  Nelson-Atkins Museum of Art: [Nelson-Atkins Museum, Atkins Auditorium, Tivoli Cinema, Galleries, Bloch Lobby]
  Lied Center of Kansas: [Main Auditorium, Pavilion]
  Museum of Kansas City: [JE Dunn Construction Theater, Corinthian Hall]
  Kansas City Repertory Theatre: [Copaken Stage]
  # #155: the Music Hall is part of the Convention Center complex, at its address; its calendar lists the hall's shows.
  Kansas City Convention Center: [Bartle Hall, Bartle Exhibit Hall, Kansas City Music Hall]
  # #155: the museum's own page names each show's gallery; the Arts Council names the museum.
  # #197: the exhibitions page names the lobby and mezzanine alone, under the museum's own header.
  Nerman Museum of Contemporary Art: [Nerman Museum, Irma Starr Gallery, McCaffree Gallery, Oppenheimer New Media Gallery, Tony and Marti Oppenheimer Gallery, Dean E. Thompson Gallery, Kansas Focus Gallery, "The Richard I. and Jeanne S. Galamba Lobby, First Floor", "The Richard I. and Jeanne S. Galamba Lobby, First Floor and The Harrison Jedel Mezzanine, Second Floor"]
  # #197: its calendar gives some events the street address alone ("1801 East 18th Street"), and some the name in capitals.
  Zhou B Art Center KC: [Zhou B Art Center Kansas City, 1801 East 18th Street]
  # Weekly audit 2026-10-26: some of its listings give the street address alone.
  Liberty Hall: [644 Massachusetts St]
  # #197: Music Theater Heritage's Ruby Room, Suite 301 at Crown Center, as Crown Center's calendar gives it.
  Music Theater Heritage: [Ruby Room, "2450 Grand Blvd., Suite 301"]
  # #197: spellings as pages give them. A name with no other names files only the same words in other
  # capitals or punctuation ("worlds of fun") under it.
  Worlds of Fun: []
  Rainy Day Books: [Rainy Day Books- Fairway]
  Midwest Trust Center: [Yardley Hall, Polsky Theatre, Midwest Trust Center at Johnson County Community College]
  Kansas City Power & Light District: [Kansas City Power & Light, PBR Big Sky]
  # #137: Crown Center is one venue page, the Shops and the Square in it.
  Crown Center: [Crown Center Shops, Crown Center Square]
  # #137: the station's own name for itself; pages also call it plain "Union Station".
  Union Station Kansas City: [Union Station]
  # #137: a library branch is shown with its system, so "Central Library" and "Central Resource Library" are told apart.
  # Each is its own building; these name it, they put no two branches together.
  Central Library (Kansas City Public Library): [Central Library]
  Plaza Branch (Kansas City Public Library): [Plaza Branch]
  Central Resource Library (Johnson County Library): [Central Resource Library]
  Blue Valley Library (Johnson County Library): [Blue Valley Library]
  Oak Park Library (Johnson County Library): [Oak Park Library]
  Monticello Library (Johnson County Library): [Monticello Library]
  Corinth Library (Johnson County Library): [Corinth Library]
  De Soto Library (Johnson County Library): [De Soto Library]
  Lenexa City Center Library (Johnson County Library): [Lenexa City Center Library]
  Leawood Pioneer Library (Johnson County Library): [Leawood Pioneer Library]

# Venue neighborhoods (#150): a venue's display name, then the neighborhood every event at it is placed
# in, whatever its page says. For a venue whose neighborhood is a fact about the venue that pages keep
# getting wrong: extraction places each event from its own page, so one venue's events can split across
# neighborhoods. Keyed on the display name, the venueAliases entry when the venue has one ("Kauffman
# Center" and "Helzberg Hall" go by the Kauffman Center's), else the name as pages give it; the
# neighborhood must be on the list above, never the catch-all. Each run places every event not expired
# at a mapped venue, read or not, and the run report names each venue that moved one. Hand-kept.
venueNeighborhoods:
  # The closest listed neighborhood, in the South KC region with the Zoo.
  Bruce R. Watkins Cultural Heritage Center: Swope Park
  Kauffman Center for the Performing Arts: Crossroads
  The Bird Comedy Theater: Crossroads
  Emily & Todd Voth Artspace: Midtown
  # Thirty miles east, in a city the catch-all would otherwise swallow (audit 2026-10-21).
  Powell Gardens: Kingsville
  # Truman Road at Van Brunt; pages place it in the East Bottoms or nowhere.
  Elmwood Cemetery: Northeast
